name: "01-building-blocks"
run-name: "${{github.actor}} is running Test"

on:
  push:
  workflow_dispatch:
env:
  first_name: Benedict

jobs:
  echo-hello:
    runs-on: ubuntu-latest

    steps:
      - name: "Say hello"
        run: echo "Hello world"

  echo-goodbye:
    runs-on: ubuntu-latest

    steps:
      - name: "Failed step"
        run: echo "good Score $first_name"
      - name: "testing branch name"
        run: echo "Testing"  
      - name: "Say goodbye"
        run: echo "Goodbye Ben"
