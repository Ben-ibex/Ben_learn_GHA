name: "01-building-blocks"
run-name: "${{github.actor}} is running Test"

on:
  push:
  workflow_dispatch:
env:
  first_name: Benedict

jobs:
  echo-hello:
    runs-on: ubuntu-latest

    steps:
      - name: "Say hello"
        run: echo "Hello world"

  echo-goodbye:
    runs-on: ubuntu-latest
    env:
      job_name: injobs

    steps:

      - name: "Failed step"
        run: echo "good Scores $first_name and $step1_name"
        env:
          step1_name: fromstep1
      - name: "testing branch name"
        run: echo "Testing"  

      - name: "scores step"
        run: echo "good scores $first_name and $job_name and $step1_name"

      - name: "Say goodbye"
        run: echo "Goodbye Ben"
